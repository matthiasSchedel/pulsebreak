name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  static-artifact:
    name: static-artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact public artifact
        run: >-
          python3 .qa/verify-public-artifact.py
          --ci
          --repo .
          --head "${{ github.event.pull_request.head.sha }}"
